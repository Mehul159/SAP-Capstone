[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-bdc-capstone"
version = "1.0.0"
description = "Sales & Revenue Analytics Platform modelled on SAP Business Data Cloud (Order-to-Cash)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["sap", "bdc", "datasphere", "etl", "analytics", "order-to-cash"]
dependencies = [
    "pandas==2.2.2",
    "numpy==1.26.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "ruff==0.5.0",
]

[tool.setuptools]
packages = ["etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["etl"]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
